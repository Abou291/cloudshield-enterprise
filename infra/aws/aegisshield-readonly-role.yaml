AWSTemplateFormatVersion: "2010-09-09"
Description: AegisShield read-only scanner role for a customer AWS account.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: IAM principal allowed to bootstrap AegisShield AssumeRole.
  ExternalId:
    Type: String
    MinLength: 16
    NoEcho: true
    Description: Unique ExternalId configured in AegisShield.
  RoleName:
    Type: String
    Default: aegisshield-readonly

Resources:
  AegisShieldReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: AegisShieldInventoryReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IdentityInventory
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - iam:ListUsers
                  - iam:ListMFADevices
                  - iam:GetLoginProfile
                  - iam:ListAccessKeys
                  - iam:ListAttachedUserPolicies
                  - iam:ListRoles
                  - iam:ListAttachedRolePolicies
                  - iam:ListPolicies
                  - iam:GetPolicyVersion
                  - iam:ListInstanceProfiles
                Resource: "*"
              - Sid: StorageInventory
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketPolicyStatus
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketLogging
                  - s3:GetBucketLocation
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:GetBucketPolicy
                  - s3:GetBucketAcl
                  - s3:GetBucketTagging
                Resource: "*"
              - Sid: NetworkInventory
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:DescribeVpcs
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeSnapshots
                Resource: "*"
              - Sid: DatabaseInventory
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"
              - Sid: ContainerAndSecretsInventory
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - secretsmanager:ListSecrets
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTags
                Resource: "*"
              - Sid: AuditAndDetectionInventory
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - securityhub:DescribeHub
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - kms:ListKeys
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - lambda:ListFunctions
                  - lambda:ListFunctionUrlConfigs
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                Resource: "*"

Outputs:
  RoleArn:
    Description: Paste this Role ARN into AegisShield.
    Value: !GetAtt AegisShieldReadOnlyRole.Arn
