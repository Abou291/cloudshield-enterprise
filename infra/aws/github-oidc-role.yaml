AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets the AegisShield GitHub workflow "Validation lab" assume a role in a SANDBOX AWS account
  through OpenID Connect, with no long-lived access key stored anywhere. Deploy only in a
  disposable account.

Parameters:
  GitHubRepository:
    Type: String
    Default: Abou291/cloudshield-enterprise
  GitHubRepositoryWithIds:
    Type: String
    Default: Abou291@237726130/cloudshield-enterprise@1378382374
    Description: >
      Repository in the ID-qualified form GitHub now puts in the OIDC "sub" claim
      (owner@ownerId/repo@repoId). The workflow prints the exact value in its "GitHub token claims" notice.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the token.actions.githubusercontent.com provider already exists.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ValidationLabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aegisshield-validation-lab
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepositoryWithIds}:*
                  - !Sub repo:${GitHubRepository}:*
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: DeployAndDeleteValidationLabOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aegisshield-validation-lab/*
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketTagging
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                Resource: "*"

Outputs:
  RoleArn:
    Description: Put this value in the GitHub repository variable AWS_VALIDATION_ROLE_ARN.
    Value: !GetAtt ValidationLabRole.Arn
