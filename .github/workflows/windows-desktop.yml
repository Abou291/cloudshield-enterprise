name: Windows Desktop Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend build dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Build local backend executable
        shell: pwsh
        run: ./scripts/build-desktop-backend.ps1

      - name: Smoke-test packaged backend
        shell: pwsh
        run: |
          $env:CLOUDSHIELD_ENV = "development"
          $env:CLOUDSHIELD_DEMO_MODE = "true"
          $process = Start-Process -FilePath "./backend/dist/aegisshield-api.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/v1/health"
                if ($response.status -eq "ok") {
                  $scan = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/api/v1/scans/demo"
                  if ($scan.assets_scanned -ne 4 -or $scan.findings_count -ne 7) {
                    throw "Packaged backend demo scan returned unexpected results"
                  }
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw "Packaged backend did not become healthy" }
          } finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
            Get-Process "aegisshield-api" -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/v1/health" | Out-Null
              throw "Port 8765 is still occupied after packaged backend cleanup"
            } catch {
              if ($_.Exception.Message -eq "Port 8765 is still occupied after packaged backend cleanup") {
                throw
              }
            }
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build unsigned Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Smoke-test packaged desktop shell
        shell: pwsh
        run: |
          $desktopExe = "./desktop/dist/win-unpacked/AegisShield.exe"
          if (-not (Test-Path $desktopExe)) { throw "Packaged desktop executable is missing" }
          $desktop = Start-Process -FilePath $desktopExe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ($desktop.HasExited) { throw "Packaged desktop exited before becoming ready" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/v1/health"
                if ($health.status -eq "ok" -and $health.instance) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw "Packaged desktop did not start its secured local backend" }
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
            Get-Process "aegisshield-api" -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Verify desktop renderer and installer output
        shell: pwsh
        run: |
          $html = Get-Content "./frontend/dist/index.html" -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') {
            throw "Desktop renderer contains absolute Vite asset paths"
          }
          if ($html -notmatch './assets/') {
            throw "Desktop renderer does not contain relative asset paths"
          }
          $installer = Get-ChildItem "./desktop/dist/AegisShield-Setup-*.exe"
          if (-not $installer) { throw "Windows installer was not produced" }
          $installer | ForEach-Object { Write-Host $_.FullName $_.Length }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AegisShield-Windows-Installer
          path: |
            desktop/dist/AegisShield-Setup-*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
