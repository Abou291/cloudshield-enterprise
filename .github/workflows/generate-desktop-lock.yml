name: Generate Desktop Lockfile

on:
  push:
    branches:
      - feature/aws-posture-v050
    paths:
      - ".github/workflows/generate-desktop-lock.yml"

permissions:
  contents: write

jobs:
  lock-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/aws-posture-v050
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate desktop lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          if (git diff --cached --quiet) {
            Write-Host "Desktop lockfile already matches package.json"
            exit 0
          }
          git commit -m "build: lock desktop npm dependencies"
          git push origin HEAD:feature/aws-posture-v050
