name: Signed Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Require version match and signing certificate
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $expected = "${{ github.ref_name }}".TrimStart("v")
          $actual = (Get-Content "./desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($actual -ne $expected) {
            throw "Tag version $expected does not match desktop package version $actual"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Signed releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets"
          }

      - name: Install and test backend
        run: |
          python -m pip install -e "./backend[dev]"
          cd backend
          pytest --cov-fail-under=75
          ruff check app tests

      - name: Build local backend executable
        shell: pwsh
        run: ./scripts/build-desktop-backend.ps1

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build:desktop

      - name: Build signed Windows installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npm run package:win

      - name: Verify Authenticode and checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem "./desktop/dist/AegisShield-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid: $($signature.Status)"
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content "./desktop/dist/SHA256SUMS.txt"

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: desktop/dist/aegisshield-sbom.cdx.json
          upload-artifact: false

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "./desktop/dist/AegisShield-Setup-*.exe" "./desktop/dist/*.blockmap" "./desktop/dist/SHA256SUMS.txt" "./desktop/dist/aegisshield-sbom.cdx.json" --verify-tag --title "AegisShield ${{ github.ref_name }}" --notes "Signed Windows release. See repository SECURITY.md and release checklist before customer deployment."
