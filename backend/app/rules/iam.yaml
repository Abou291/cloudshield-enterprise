rules:
  - id: IAM-001
    name: IAM user without MFA
    description: A console-capable IAM user is not protected by multi-factor authentication.
    resource_type: iam_user
    severity: high
    confidence: 0.95
    context_factors: [privileged]
    conditions:
      - path: mfa_enabled
        operator: is_false
      - path: console_access
        operator: not_equals
        value: false
    remediation: Enable MFA and prefer federated, short-lived access through IAM Identity Center.

  - id: IAM-002
    name: IAM user has AdministratorAccess
    description: An IAM user has the AWS-managed AdministratorAccess policy attached directly.
    resource_type: iam_user
    severity: critical
    confidence: 0.98
    context_factors: [privileged]
    conditions:
      - path: administrator_access
        operator: is_true
    remediation: Remove direct administrator access and grant task-specific permissions through roles.

  - id: IAM-003
    name: IAM access key older than 90 days
    description: A long-lived access key is older than the configured rotation threshold.
    resource_type: iam_user
    severity: medium
    confidence: 0.90
    context_factors: [privileged]
    conditions:
      - path: oldest_access_key_days
        operator: older_than_days
        value: 90
    remediation: Disable and rotate the key, then migrate the workload to short-lived role credentials.


  - id: IAM-008
    name: IAM user has both console access and active access keys
    description: A user that can sign in to the console also holds active long-lived access keys, doubling the credentials that can be stolen.
    resource_type: iam_user
    severity: low
    confidence: 0.85
    context_factors: [privileged]
    conditions:
      - path: console_access
        operator: is_true
      - path: active_access_keys
        operator: at_least
        value: 1
    remediation: Keep console access for people and use roles or short-lived credentials for programmatic access; delete unused keys.

  - id: IAM-010
    name: Customer-managed policy grants full administrative access
    description: An attached customer-managed IAM policy allows every action on every resource without a condition.
    resource_type: iam_policy
    severity: high
    confidence: 0.97
    context_factors: [privileged]
    conditions:
      - path: full_admin
        operator: is_true
    remediation: Replace the wildcard policy with a least-privilege policy scoped to the actions and resources the workload needs.
