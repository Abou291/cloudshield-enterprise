services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudshield
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      CLOUDSHIELD_ENV: development
      CLOUDSHIELD_DEMO_MODE: "true"
      CLOUDSHIELD_DATABASE_URL: postgresql+psycopg://cloudshield:local-only-password@db:5432/cloudshield
      CLOUDSHIELD_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
